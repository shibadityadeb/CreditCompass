# Render Blueprint - Free Tier Configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: creditcompass
    runtime: python
    region: oregon  # Free tier available in oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_DEBUG
        value: False
      - key: MODEL_PATH
        value: xgb_credit_model.pkl
      - key: OPENROUTER_API_KEY
        sync: false   # Set manually in Render dashboard — keep secret
    healthCheckPath: /health
    autoDeploy: true
